name: Release Automation

on:
  release:
    types: [published]

jobs:
  update-homebrew-tap:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_CLEAN="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION_CLEAN}" >> $GITHUB_OUTPUT

      # ✅ UPDATED STEP (compute both SHAs)
      - name: Download release binaries and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          VERSION_CLEAN="${{ steps.release.outputs.version_clean }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION"

          # Darwin
          DARWIN_URL="$BASE_URL/nifectl_${VERSION_CLEAN}_darwin_amd64.tar.gz"
          curl -sL "$DARWIN_URL" -o darwin.tar.gz
          DARWIN_SHA=$(sha256sum darwin.tar.gz | awk '{print $1}')

          # Linux
          LINUX_URL="$BASE_URL/nifectl_${VERSION_CLEAN}_linux_amd64.tar.gz"
          curl -sL "$LINUX_URL" -o linux.tar.gz
          LINUX_SHA=$(sha256sum linux.tar.gz | awk '{print $1}')

          echo "darwin_sha=${DARWIN_SHA}" >> $GITHUB_OUTPUT
          echo "linux_sha=${LINUX_SHA}" >> $GITHUB_OUTPUT
          echo "darwin_url=${DARWIN_URL}" >> $GITHUB_OUTPUT
          echo "linux_url=${LINUX_URL}" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap repo
        uses: actions/checkout@v4
        with:
          repository: nifetency/homebrew-tap
          token: ${{ secrets.RELEASE_PAT }}
          path: homebrew-tap

      # ✅ UPDATED STEP (update both mac + linux)
      - name: Update Homebrew formula
        run: |
          FORMULA="homebrew-tap/Formula/nifectl.rb"

          # macOS
          sed -i 's|url ".*darwin.*"|url "${{ steps.sha.outputs.darwin_url }}"|' "$FORMULA"
          sed -i 's|sha256 ".*darwin.*"|sha256 "${{ steps.sha.outputs.darwin_sha }}"|' "$FORMULA"

          # Linux
          sed -i 's|url ".*linux.*"|url "${{ steps.sha.outputs.linux_url }}"|' "$FORMULA"
          sed -i 's|sha256 ".*linux.*"|sha256 "${{ steps.sha.outputs.linux_sha }}"|' "$FORMULA"

      
  update-nife-io:
    name: Update nife.io Release Config
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_CLEAN="${VERSION#v}"
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION_CLEAN}" >> $GITHUB_OUTPUT
          echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: Checkout nife.io repo
        uses: actions/checkout@v4
        with:
          repository: nifetency/nife.io
          token: ${{ secrets.RELEASE_PAT }}
          path: nife-io

      - name: Update release config/index file
        run: |
          CONFIG_FILE="nife-io/releases/index.json"

          # ✅ Ensure directory exists
          mkdir -p nife-io/releases

          cat > "$CONFIG_FILE" <<EOF
          {
            "latest": "${{ steps.release.outputs.version_clean }}",
            "version": "${{ steps.release.outputs.version_clean }}",
            "tag": "${{ steps.release.outputs.version }}",
            "release_date": "${{ steps.release.outputs.release_date }}",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.version }}",
            "changelog": "${{ github.event.release.html_url }}"
          }
          EOF

      - name: Commit and push nife.io release config update
        working-directory: nife-io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/index.json
          git commit -m "chore: update nifectl release to ${{ steps.release.outputs.version }}" || echo "No changes"
          git push